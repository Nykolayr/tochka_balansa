name: tochka_balansa
description: "Tochka Balansa"

publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.8.1

# com.tochka.balansa
# изменить имя
# AndroidManifest.xml (located at android/app/src/main
# <application android:label="App Name" ...>
# info.plist (located at ios/Runner)
# <key>CFBundleDisplayName</key>
# <string>App Name</string>

#обязательно для удаления очищения данных
# <application android:allowBackup="false"
# android:fullBackupContent="false"
# в файле AndroidManifest.xml

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8 
  flutter_bloc: ^9.1.1  
  bloc: ^9.0.0
  equatable: ^2.0.7
  page_transition: ^2.2.1
  shared_preferences: ^2.5.3
  flutter_launcher_icons: ^0.14.4
  go_router: ^15.1.3
  get: ^4.7.2
  dio: ^5.8.0+1
  gap: ^3.0.1
  intl: ^0.20.2
  flutter_easylogger: ^2.3.3
  flutter_svg: ^2.1.0
  package_info_plus: ^8.3.0
  device_info_plus: ^11.4.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  share_plus: ^11.0.0
  fluttertoast: ^8.2.12
  google_fonts: ^6.1.0 
  # tape_slider: ^0.0.2 
  # animated_weight_picker: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# flutter pub run flutter_launcher_icons:main
flutter_launcher_icons:
  android: true  
  ios: true
  remove_alpha_ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#ffffff" 
  adaptive_icon_foreground: "assets/logo.png" 

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/images/
  generate: true
    
